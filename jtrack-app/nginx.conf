server {
    listen 80;
    server_name localhost;

    # Force absolute redirects to be turned off so Nginx issues relative redirects
    absolute_redirect off; 
    port_in_redirect off;

    # 1. Catch the exact path without a slash and issue a strict relative redirect
    location = /jtrack {
        return 301 /jtrack/;
    }

    # 2. Serve the Angular application
    location /jtrack/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /jtrack/index.html;
        index index.html;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

